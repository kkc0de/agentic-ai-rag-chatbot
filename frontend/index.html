<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agentic AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">✦</div>

                <div>
                    <h1>Agentic AI Assistant</h1>
                    <p>Grounded in the Agentic AI eBook</p>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                RAG Online
            </div>
        </header>


        <main class="chat-container">

            <div id="messages" class="messages">

                <div id="welcomeMessage" class="welcome">

                    <div class="welcome-icon">✦</div>

                    <h2>Ask about Agentic AI</h2>

                    <p>
                        Ask a question and I'll answer using
                        information retrieved from the Agentic AI eBook.
                    </p>

                    <div class="suggestions">

                        <button onclick="useSuggestion('What is Agentic AI?')">
                            What is Agentic AI?
                        </button>

                        <button onclick="useSuggestion('What are AI agents?')">
                            What are AI agents?
                        </button>

                        <button onclick="useSuggestion('What are the key characteristics of Agentic AI?')">
                            Key characteristics of Agentic AI
                        </button>

                    </div>

                </div>

            </div>

        </main>


        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="questionInput"
                    placeholder="Ask something about Agentic AI..."
                    rows="1"
                ></textarea>

                <button id="sendButton" onclick="sendMessage()">
                    <span>Send</span>
                    <span>➤</span>
                </button>

            </div>

            <p class="disclaimer">
                Answers are generated from the provided Agentic AI eBook.
            </p>

        </div>

    </div>


    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
